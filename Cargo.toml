[package]
name = 'coalix'
version = '0.1.0'
edition = '2021'
rust-version = '1.85'
authors = ['Coalix Contributors']
description = 'Zero-config, blazing-fast request-coalescing reverse proxy for the thundering-herd problem.'
documentation = 'https://docs.rs/coalix'
homepage = 'https://github.com/coalix-rs/coalix'
repository = 'https://github.com/coalix-rs/coalix'
readme = 'README.md'
license = 'MIT OR Apache-2.0'
# Phase 5 publish set: ship what consumers need (src, examples, tests,
# benches, config, README, license files); keep repo-only tooling out of
# the `.crate` tarball.
exclude = [
    'target/',
    '.github/',
    '.clinerules',
    'docs/',
    'Dockerfile',
    'docker-compose.yml',
    '*.log',
]
keywords = ['reverse-proxy', 'coalescing', 'thundering-herd', 'single-flight', 'high-performance']
categories = ['network-programming', 'web-programming', 'concurrency']

[lib]
name = 'coalix'
path = 'src/lib.rs'

[[bin]]
name = 'coalix'
path = 'src/main.rs'

[dependencies]
# --- runtime and HTTP stack -----------------------------------------------------------
tokio = { version = '1.41', features = ['macros', 'rt-multi-thread', 'net', 'sync', 'time', 'signal', 'io-util'] }
hyper = { version = '1.5', features = ['http1', 'http2', 'client', 'server'] }
hyper-util = { version = '0.1', features = ['tokio', 'http1', 'http2', 'client', 'client-legacy', 'server', 'server-auto'] }
http = '1.1'
http-body-util = '0.1'
bytes = '1.7'

# --- coalescing state ------------------------------------------------------------
dashmap = '6.1'

# --- configuration and CLI ----------------------------------------------------------
clap = { version = '4.5', features = ['derive'] }
serde = { version = '1.0', features = ['derive'] }
serde_yaml = '0.9'

# --- error handling and observability -----------------------------------------------
thiserror = '2.0'
anyhow = '1.0'
tracing = '0.1'
tracing-subscriber = { version = '0.3', features = ['env-filter', 'fmt', 'json'] }

[dev-dependencies]
# Virtual-clock support (`tokio::time::advance`, `start_paused`) for tests —
# dev-only, so release builds never carry it.
tokio = { version = '1.41', features = ['test-util'] }
# Micro-benchmark harness for `benches/hot_paths.rs` (Phase 4).
criterion = '0.5'

[[bench]]
name = 'hot_paths'
harness = false

[profile.release]
opt-level = 3
lto = 'thin'
codegen-units = 1
panic = 'abort'
strip = 'symbols'
